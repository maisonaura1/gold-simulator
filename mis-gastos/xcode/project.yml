name: MisGastos
options:
  bundleIdPrefix: com.misgastos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # <- pon aquí tu Team ID (o elígelo en Xcode > Signing)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MisGastos:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Shared
      - Resources
    dependencies:
      - target: MisGastosWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misgastos.app
        PRODUCT_NAME: Mis Gastos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Support/MisGastos-Info.plist
      properties:
        CFBundleDisplayName: Mis Gastos
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: Mis Gastos usa Face ID para proteger tus gastos personales.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.misgastos.app
            CFBundleURLSchemes: [misgastos]
    entitlements:
      path: Support/MisGastos.entitlements
      properties:
        com.apple.security.application-groups: [group.com.misgastos.app]
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  MisGastosWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misgastos.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Support/MisGastosWidget-Info.plist
      properties:
        CFBundleDisplayName: Mis Gastos
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/MisGastosWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.misgastos.app]
        com.apple.security.app-sandbox: true

  MisGastosTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misgastos.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MisGastos:
    build:
      targets:
        MisGastos: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MisGastosTests]
