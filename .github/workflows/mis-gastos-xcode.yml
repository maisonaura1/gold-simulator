name: Mis Gastos (Xcode)

on:
  workflow_dispatch:
  pull_request:
    paths: ["mis-gastos/xcode/**"]

jobs:
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mis-gastos/xcode
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & test (macOS, sin firmar)
        run: |
          xcodebuild test -project MisGastos.xcodeproj -scheme MisGastos \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
